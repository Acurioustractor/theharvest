<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Wall — Print Card (6x4)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,700&family=DM+Serif+Display&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  @page {
    size: 6in 4in;
    margin: 0;
  }

  body {
    background: #e8e4dc;
    font-family: 'DM Sans', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .card {
    width: 6in;
    height: 4in;
    background: #1C1917;
    color: #F5F0E8;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  .left {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0.4in 0.35in;
  }

  .logo {
    width: 1in;
    height: auto;
    filter: brightness(0) invert(1);
    margin-bottom: 0.2in;
  }

  .title {
    font-family: 'DM Serif Display', serif;
    font-size: 28pt;
    font-weight: 400;
    letter-spacing: 0.06em;
    line-height: 1.15;
    margin-bottom: 0.12in;
  }

  .subtitle {
    font-size: 10pt;
    line-height: 1.6;
    opacity: 0.6;
    margin-bottom: 0.2in;
    max-width: 2.4in;
  }

  .steps {
    list-style: none;
    font-size: 9pt;
    line-height: 1.7;
    opacity: 0.8;
  }

  .steps li {
    margin-bottom: 4px;
  }

  .steps .num {
    display: inline-block;
    width: 18px;
    height: 18px;
    line-height: 18px;
    text-align: center;
    background: #C4922A;
    color: #1C1917;
    border-radius: 50%;
    font-size: 8pt;
    font-weight: 700;
    margin-right: 6px;
    vertical-align: middle;
  }

  .right {
    width: 2.2in;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.3in;
    background: rgba(245, 240, 232, 0.04);
  }

  .qr {
    width: 1.6in;
    height: 1.6in;
    background: white;
    padding: 0.1in;
    border-radius: 8px;
    margin-bottom: 0.15in;
  }

  .qr img {
    width: 100%;
    height: 100%;
    display: block;
  }

  .scan-text {
    font-family: 'DM Serif Display', serif;
    font-size: 11pt;
    letter-spacing: 0.1em;
    text-align: center;
    color: #C4922A;
    margin-bottom: 4px;
  }

  .url-text {
    font-size: 7pt;
    opacity: 0.4;
    text-align: center;
  }

  .accent-line {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #C4922A 0%, #4A6741 50%, #B58B70 100%);
  }

  @media print {
    body { background: none; min-height: auto; }
    .card { box-shadow: none; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="left">
    <img src="/images/logo-v1-dark-clean.png" alt="The Harvest" class="logo" />
    <div class="title">PHOTO<br/>WALL</div>
    <p class="subtitle">
      Get a free portrait taken today. We'll send you a copy after the gathering.
    </p>
    <ol class="steps">
      <li><span class="num">1</span> Scan the QR code</li>
      <li><span class="num">2</span> Enter your name and email</li>
      <li><span class="num">3</span> Come find us for your portrait</li>
    </ol>
  </div>
  <div class="right">
    <div class="qr">
      <img src="/images/qr-photo-wall-signup.png" alt="Scan to sign up" />
    </div>
    <p class="scan-text">SCAN ME</p>
    <p class="url-text">theharvestwitta.com.au/whats-on</p>
  </div>
  <div class="accent-line"></div>
</div>

</body>
</html>
