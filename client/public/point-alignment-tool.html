<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building Key Point Alignment Tool</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a1a; color: #e0e0e0; overflow: hidden; height: 100vh; }

  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: #222; border-bottom: 1px solid #444; padding: 8px 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  #toolbar h1 { font-size: 14px; font-weight: 600; color: #f5a623; white-space: nowrap; }
  #toolbar button {
    padding: 6px 14px; border-radius: 6px; border: 1px solid #555; background: #333;
    color: #ddd; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  #toolbar button:hover { background: #444; }
  #toolbar button.primary { background: #f5a623; color: #000; border-color: #f5a623; font-weight: 600; }
  #toolbar button.primary:hover { background: #e09515; }
  #toolbar button.danger { background: #c0392b; color: #fff; border-color: #c0392b; }
  #toolbar .spacer { flex: 1; }
  #toolbar select { padding: 4px 8px; border-radius: 4px; border: 1px solid #555; background: #333; color: #ddd; font-size: 12px; }

  #canvas-area {
    position: absolute; top: 48px; bottom: 0; left: 0; right: 300px;
    overflow: auto; display: flex; align-items: center; justify-content: center;
    background: #111;
  }

  #image-container {
    position: relative; display: inline-block; cursor: crosshair;
  }
  #image-container img {
    display: block; max-width: 100%; height: auto;
    user-select: none; -webkit-user-drag: none;
  }

  .key-point {
    position: absolute; z-index: 10; cursor: grab;
    transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 6px;
    transition: none;
  }
  .key-point.dragging { cursor: grabbing; z-index: 20; }
  .key-point .pin {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    background: #fff; color: #444; border: 2px solid #ccc;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .key-point.selected .pin {
    background: #f5a623; color: #fff; border-color: #f5a623;
    box-shadow: 0 0 0 3px rgba(245,166,35,0.3), 0 2px 6px rgba(0,0,0,0.3);
  }
  .key-point .label {
    padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
    background: rgba(255,255,255,0.95); color: #444;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .key-point.selected .label { background: #f5a623; color: #fff; }

  #sidebar {
    position: fixed; top: 48px; right: 0; bottom: 0; width: 300px;
    background: #222; border-left: 1px solid #444; overflow-y: auto; padding: 12px;
  }
  #sidebar h2 { font-size: 13px; font-weight: 600; color: #f5a623; margin-bottom: 8px; }

  .point-item {
    padding: 8px; margin-bottom: 6px; border-radius: 6px; border: 1px solid #444;
    background: #2a2a2a; cursor: pointer; font-size: 12px;
  }
  .point-item:hover { border-color: #666; }
  .point-item.selected { border-color: #f5a623; background: #332a1a; }
  .point-item .point-header { display: flex; align-items: center; gap: 6px; }
  .point-item .point-num {
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; background: #555; color: #fff; flex-shrink: 0;
  }
  .point-item.selected .point-num { background: #f5a623; }
  .point-item .point-name { font-weight: 600; color: #ddd; }
  .point-item .point-coords { color: #888; font-size: 10px; margin-top: 4px; margin-left: 26px; }

  #edit-panel {
    margin-top: 12px; padding: 12px; border-radius: 6px; border: 1px solid #f5a623;
    background: #2a2a1a;
  }
  #edit-panel h3 { font-size: 12px; font-weight: 600; color: #f5a623; margin-bottom: 8px; }
  #edit-panel label { display: block; font-size: 11px; color: #999; margin-top: 6px; }
  #edit-panel input, #edit-panel textarea {
    width: 100%; padding: 5px 8px; margin-top: 2px; border-radius: 4px;
    border: 1px solid #555; background: #333; color: #ddd; font-size: 12px;
    font-family: inherit;
  }
  #edit-panel textarea { resize: vertical; min-height: 50px; }
  #edit-panel .coords-row { display: flex; gap: 8px; }
  #edit-panel .coords-row > div { flex: 1; }

  #export-modal {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.7); align-items: center; justify-content: center;
  }
  #export-modal.show { display: flex; }
  #export-modal .modal {
    background: #222; border: 1px solid #555; border-radius: 8px;
    padding: 20px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto;
  }
  #export-modal h2 { font-size: 14px; color: #f5a623; margin-bottom: 8px; }
  #export-modal pre {
    background: #111; padding: 12px; border-radius: 6px; font-size: 11px;
    overflow-x: auto; color: #ccc; white-space: pre-wrap; word-break: break-all;
  }
  #export-modal .actions { margin-top: 12px; display: flex; gap: 8px; }

  .crosshair-guide {
    position: absolute; pointer-events: none; z-index: 5;
  }
  .crosshair-h { left: 0; right: 0; height: 1px; background: rgba(245,166,35,0.3); }
  .crosshair-v { top: 0; bottom: 0; width: 1px; background: rgba(245,166,35,0.3); }

  #coords-display {
    position: fixed; bottom: 12px; left: 12px; z-index: 100;
    background: #222; border: 1px solid #444; border-radius: 4px;
    padding: 4px 10px; font-size: 11px; color: #888; font-family: monospace;
  }
</style>
</head>
<body>

<div id="toolbar">
  <h1>Building Key Points</h1>
  <button onclick="addPoint()">+ Add Point</button>
  <button onclick="deleteSelected()" class="danger" id="btn-delete" style="display:none">Delete</button>
  <div class="spacer"></div>
  <label style="font-size:11px;color:#999;">
    <input type="checkbox" id="show-crosshairs" checked onchange="toggleCrosshairs()"> Crosshairs
  </label>
  <label style="font-size:11px;color:#999;">
    <input type="checkbox" id="show-labels" checked onchange="toggleLabels()"> Labels
  </label>
  <button onclick="showExport()" class="primary">Export JSON</button>
</div>

<div id="canvas-area">
  <div id="image-container">
    <img id="plan-image" src="/images/plans/building-layout-detail.jpeg" alt="Building layout" />
    <div id="crosshair-h" class="crosshair-guide crosshair-h" style="display:none"></div>
    <div id="crosshair-v" class="crosshair-guide crosshair-v" style="display:none"></div>
  </div>
</div>

<div id="sidebar">
  <h2>Key Points</h2>
  <div id="points-list"></div>
  <div id="edit-panel" style="display:none">
    <h3>Edit Point</h3>
    <label>Name</label>
    <input type="text" id="edit-name" oninput="updateField('name', this.value)" />
    <label>ID</label>
    <input type="text" id="edit-id" oninput="updateField('id', this.value)" />
    <div class="coords-row">
      <div>
        <label>X %</label>
        <input type="number" id="edit-x" step="0.1" oninput="updateCoord('x', this.value)" />
      </div>
      <div>
        <label>Y %</label>
        <input type="number" id="edit-y" step="0.1" oninput="updateCoord('y', this.value)" />
      </div>
    </div>
    <label>Description</label>
    <textarea id="edit-desc" oninput="updateField('description', this.value)"></textarea>
    <label>Planned Use</label>
    <textarea id="edit-planned" oninput="updateField('plannedUse', this.value)"></textarea>
  </div>
</div>

<div id="coords-display">x: — y: —</div>

<div id="export-modal">
  <div class="modal">
    <h2>Export Key Points</h2>
    <pre id="export-json"></pre>
    <div class="actions">
      <button onclick="copyExport()" class="primary">Copy to Clipboard</button>
      <button onclick="closeExport()">Close</button>
    </div>
  </div>
</div>

<script>
// Initial key points from FloorPlanViewer.tsx
let keyPoints = [
  { id: "kitchen", name: "Kitchen & Service", description: "The cold room and staff room wing becomes the heart of food production — open fire kitchen with servery window looking out to gardens.", plannedUse: "Open fire cooking, cold storage, prep area, service corridor behind bar. Chefs access the garden directly to pick produce. \"This kitchen is a stage.\"", x: 30, y: 22 },
  { id: "restaurant", name: "Restaurant & Gallery", description: "The large central hall (formerly Mail Order / Receive & Pack) — rammed earth walls, high ceilings, natural light. The biggest space in the building.", plannedUse: "Modular restaurant with lowering truss system for lighting and performance. Art gallery walls with flexible rail hanging. Seasonal shows — summer, winter, autumn, spring. Everything on wheels for quick changeovers. 30–40 seated.", x: 42, y: 48 },
  { id: "cafe", name: "Cafe & Bar", description: "Near the garden-side entry — the first thing visitors encounter. Bar area with large window into the kitchen for visual connection.", plannedUse: "Bar with high table seating along walls, lounge-style couches, table lamps. \"Homefeel\" atmosphere — residential furniture, not commercial. Servery to the gardens and pavilion area outside.", x: 22, y: 55 },
  { id: "classroom", name: "The Classroom", description: "Self-contained right wing (formerly Seed Pack & Seed Store) — separate entry, air-conditioned studio space. 20-person capacity.", plannedUse: "Bookable education space: pottery, cooking classes, Pilates, design workshops, community courses. Multi-medium artist residencies — designers, chefs, sound designers, lighting designers rotating through.", x: 75, y: 30 },
  { id: "artist-studio", name: "Artist in Residence", description: "The transition zone between main hall and classroom wing — production facility where artists work on pieces that will be displayed throughout the building.", plannedUse: "Walk-through workshop as part of the visitor experience — \"stepping into Narnia.\" Artists create exhibition pieces visible to guests. Enterprise incubator space for local makers and craftspeople.", x: 58, y: 30 },
  { id: "courtyard", name: "Covered Courtyard", description: "The outdoor space between the building wings — sheltered by roof overhangs, connected to gardens. Tables, plants, dappled light.", plannedUse: "Outdoor dining overflow, covered tables for all-weather use. Servery window from kitchen. Connection point between restaurant, classroom, and gardens. Community gathering in the fresh air.", x: 52, y: 60 },
];

let selectedId = null;
let dragging = null;
let dragOffset = { x: 0, y: 0 };
let showLabelsFlag = true;

const container = document.getElementById('image-container');
const img = document.getElementById('plan-image');
const coordsDisplay = document.getElementById('coords-display');

function render() {
  // Remove existing point elements
  container.querySelectorAll('.key-point').forEach(el => el.remove());

  keyPoints.forEach((point, index) => {
    const el = document.createElement('div');
    el.className = `key-point${selectedId === point.id ? ' selected' : ''}`;
    el.dataset.id = point.id;
    el.style.left = point.x + '%';
    el.style.top = point.y + '%';
    el.innerHTML = `
      <div class="pin">${index + 1}</div>
      <div class="label" style="${showLabelsFlag ? '' : 'display:none'}">${point.name}</div>
    `;

    el.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      selectPoint(point.id);
      startDrag(point.id, e);
    });

    container.appendChild(el);
  });

  renderSidebar();
}

function renderSidebar() {
  const list = document.getElementById('points-list');
  list.innerHTML = keyPoints.map((p, i) => `
    <div class="point-item${selectedId === p.id ? ' selected' : ''}" onclick="selectPoint('${p.id}')">
      <div class="point-header">
        <div class="point-num">${i + 1}</div>
        <div class="point-name">${p.name}</div>
      </div>
      <div class="point-coords">x: ${p.x.toFixed(1)}  y: ${p.y.toFixed(1)}</div>
    </div>
  `).join('');

  const panel = document.getElementById('edit-panel');
  const deleteBtn = document.getElementById('btn-delete');

  if (selectedId) {
    const p = keyPoints.find(k => k.id === selectedId);
    if (p) {
      panel.style.display = 'block';
      deleteBtn.style.display = 'inline-block';
      document.getElementById('edit-name').value = p.name;
      document.getElementById('edit-id').value = p.id;
      document.getElementById('edit-x').value = p.x.toFixed(1);
      document.getElementById('edit-y').value = p.y.toFixed(1);
      document.getElementById('edit-desc').value = p.description;
      document.getElementById('edit-planned').value = p.plannedUse;
    }
  } else {
    panel.style.display = 'none';
    deleteBtn.style.display = 'none';
  }
}

function selectPoint(id) {
  selectedId = selectedId === id ? null : id;
  render();
}

function startDrag(id, e) {
  dragging = id;
  const point = keyPoints.find(p => p.id === id);
  const rect = img.getBoundingClientRect();
  const currentPixelX = (point.x / 100) * rect.width;
  const currentPixelY = (point.y / 100) * rect.height;
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  dragOffset.x = mouseX - currentPixelX;
  dragOffset.y = mouseY - currentPixelY;

  document.querySelector(`.key-point[data-id="${id}"]`)?.classList.add('dragging');
}

document.addEventListener('mousemove', (e) => {
  const rect = img.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const px = (mx / rect.width * 100).toFixed(1);
  const py = (my / rect.height * 100).toFixed(1);
  coordsDisplay.textContent = `x: ${px}  y: ${py}`;

  // Crosshairs
  if (document.getElementById('show-crosshairs').checked) {
    const ch = document.getElementById('crosshair-h');
    const cv = document.getElementById('crosshair-v');
    if (mx >= 0 && mx <= rect.width && my >= 0 && my <= rect.height) {
      ch.style.display = 'block';
      cv.style.display = 'block';
      ch.style.top = my + 'px';
      cv.style.left = mx + 'px';
    } else {
      ch.style.display = 'none';
      cv.style.display = 'none';
    }
  }

  if (!dragging) return;

  const point = keyPoints.find(p => p.id === dragging);
  if (!point) return;

  const x = ((mx - dragOffset.x) / rect.width) * 100;
  const y = ((my - dragOffset.y) / rect.height) * 100;
  point.x = Math.max(0, Math.min(100, x));
  point.y = Math.max(0, Math.min(100, y));

  // Update DOM directly for smooth dragging
  const el = document.querySelector(`.key-point[data-id="${dragging}"]`);
  if (el) {
    el.style.left = point.x + '%';
    el.style.top = point.y + '%';
  }

  // Update sidebar coords
  const coordsEl = document.querySelector(`.point-item.selected .point-coords`);
  if (coordsEl) coordsEl.textContent = `x: ${point.x.toFixed(1)}  y: ${point.y.toFixed(1)}`;

  // Update edit fields
  document.getElementById('edit-x').value = point.x.toFixed(1);
  document.getElementById('edit-y').value = point.y.toFixed(1);
});

document.addEventListener('mouseup', () => {
  if (dragging) {
    document.querySelector(`.key-point[data-id="${dragging}"]`)?.classList.remove('dragging');
    dragging = null;
    render();
  }
});

// Click on image to deselect
container.addEventListener('mousedown', (e) => {
  if (e.target === img) {
    selectedId = null;
    render();
  }
});

function addPoint() {
  const num = keyPoints.length + 1;
  const newPoint = {
    id: `new-point-${num}`,
    name: `New Point ${num}`,
    description: '',
    plannedUse: '',
    x: 50,
    y: 50,
  };
  keyPoints.push(newPoint);
  selectedId = newPoint.id;
  render();
}

function deleteSelected() {
  if (!selectedId) return;
  if (!confirm('Delete this point?')) return;
  keyPoints = keyPoints.filter(p => p.id !== selectedId);
  selectedId = null;
  render();
}

function updateField(field, value) {
  const p = keyPoints.find(k => k.id === selectedId);
  if (p) { p[field] = value; render(); }
}

function updateCoord(axis, value) {
  const p = keyPoints.find(k => k.id === selectedId);
  if (p) {
    p[axis] = parseFloat(value) || 0;
    // Update pin position
    const el = document.querySelector(`.key-point[data-id="${selectedId}"]`);
    if (el) {
      el.style.left = p.x + '%';
      el.style.top = p.y + '%';
    }
  }
}

function toggleCrosshairs() {
  const show = document.getElementById('show-crosshairs').checked;
  document.getElementById('crosshair-h').style.display = show ? '' : 'none';
  document.getElementById('crosshair-v').style.display = show ? '' : 'none';
}

function toggleLabels() {
  showLabelsFlag = document.getElementById('show-labels').checked;
  render();
}

function showExport() {
  const json = JSON.stringify(keyPoints, null, 2);
  document.getElementById('export-json').textContent = json;
  document.getElementById('export-modal').classList.add('show');
}

function closeExport() {
  document.getElementById('export-modal').classList.remove('show');
}

function copyExport() {
  const json = JSON.stringify(keyPoints, null, 2);
  navigator.clipboard.writeText(json).then(() => {
    const btn = document.querySelector('#export-modal .primary');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy to Clipboard'; }, 1500);
  });
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Escape') {
    if (document.getElementById('export-modal').classList.contains('show')) {
      closeExport();
    } else {
      selectedId = null;
      render();
    }
  }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selectedId) deleteSelected();
  }
  // Arrow keys for fine adjustment
  if (selectedId && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
    e.preventDefault();
    const p = keyPoints.find(k => k.id === selectedId);
    if (!p) return;
    const step = e.shiftKey ? 0.1 : 0.5;
    if (e.key === 'ArrowUp') p.y = Math.max(0, p.y - step);
    if (e.key === 'ArrowDown') p.y = Math.min(100, p.y + step);
    if (e.key === 'ArrowLeft') p.x = Math.max(0, p.x - step);
    if (e.key === 'ArrowRight') p.x = Math.min(100, p.x + step);
    render();
  }
  // Tab to cycle through points
  if (e.key === 'Tab') {
    e.preventDefault();
    const idx = keyPoints.findIndex(p => p.id === selectedId);
    const next = e.shiftKey
      ? (idx <= 0 ? keyPoints.length - 1 : idx - 1)
      : (idx + 1) % keyPoints.length;
    selectedId = keyPoints[next].id;
    render();
  }
});

// Init
img.onload = render;
if (img.complete) render();
</script>
</body>
</html>
