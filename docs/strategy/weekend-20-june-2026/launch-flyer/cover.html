<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Nunito+Sans:wght@400;600;700;800&display=swap');
  :root{--golden-light:#E8C16A;--crane:#8B4A2A;--cream:#F5EFE2;--ink:#231711;
    --earth:#B58B70;--canopy:#4A6741;--golden:#C4922A;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1920px;height:1080px;}
  body{font-family:'Nunito Sans',sans-serif;}
  .stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--ink);}
  .photo-wrap{position:absolute;top:0;left:0;right:0;height:596px;overflow:hidden;}
  .photo{width:100%;height:100%;object-fit:cover;object-position:center 42%;}
  .scrim-top{position:absolute;top:0;left:0;right:0;height:280px;
    background:linear-gradient(180deg, rgba(26,18,11,0.62) 0%, rgba(26,18,11,0.0) 100%);}
  .brand{position:absolute;top:48px;left:76px;display:flex;align-items:center;gap:24px;z-index:3;}
  .brand img{height:112px;filter:brightness(0) invert(1) drop-shadow(0 2px 8px rgba(0,0,0,0.5));}
  .brand .place{color:#fff;font-weight:700;letter-spacing:0.44em;font-size:25px;
    text-transform:uppercase;border-left:2px solid rgba(255,255,255,0.6);padding-left:24px;
    padding-top:6px;text-shadow:0 2px 8px rgba(0,0,0,0.5);}
  .bar{position:absolute;top:596px;left:0;right:0;height:12px;z-index:4;
    background:linear-gradient(90deg,var(--crane) 0%,var(--golden) 34%,var(--earth) 67%,var(--canopy) 100%);}
  .band{position:absolute;left:0;right:0;bottom:0;height:484px;
    background:radial-gradient(120% 170% at 16% 0%, #2c1d12 0%, #231711 60%, #1c130c 100%);
    display:flex;gap:60px;padding:42px 76px 40px;}
  .band-left{flex:1;display:flex;flex-direction:column;color:var(--cream);}
  .eyebrow{color:var(--golden-light);font-weight:800;letter-spacing:0.32em;font-size:29px;
    text-transform:uppercase;margin-bottom:8px;}
  .headline{font-family:'Fraunces',serif;font-weight:600;font-size:106px;line-height:0.94;
    color:#fff;letter-spacing:-0.015em;}
  .when{font-family:'Fraunces',serif;font-weight:400;font-style:italic;font-size:44px;
    color:var(--golden-light);margin-top:12px;}
  .sub{font-weight:600;font-size:32px;line-height:1.32;color:var(--cream);opacity:0.95;
    margin-top:16px;max-width:1000px;}
  .foot{margin-top:auto;display:flex;align-items:center;gap:32px;flex-wrap:wrap;}
  .price{display:inline-flex;align-items:baseline;gap:15px;
    background:linear-gradient(135deg,#E8C16A 0%, #C4922A 100%);color:var(--ink);
    border-radius:999px;padding:16px 34px;box-shadow:0 10px 28px rgba(0,0,0,0.4);}
  .price .amt{font-family:'Fraunces',serif;font-weight:700;font-size:50px;line-height:1;}
  .price .per{font-weight:700;font-size:24px;}
  .where{display:flex;align-items:center;gap:11px;font-weight:600;font-size:28px;
    color:var(--cream);opacity:0.92;}
  .band-right{width:320px;display:flex;align-items:center;justify-content:center;}
  .qr{background:var(--cream);border-radius:24px;padding:26px 26px 22px;display:flex;
    flex-direction:column;align-items:center;box-shadow:0 16px 44px rgba(0,0,0,0.45);width:100%;}
  .qr img{width:248px;height:248px;display:block;border-radius:8px;}
  .qr .scan{font-weight:800;font-size:25px;color:var(--ink);margin-top:16px;text-align:center;line-height:1.18;}
  .qr .fb{font-weight:700;font-size:19px;color:var(--crane);margin-top:5px;text-align:center;}
</style>
</head>
<body>
  <div class="stage">
    <div class="photo-wrap">
      <img class="photo" src="file:///Users/benknight/Code/The%20Harvest%20Website/client/public/images/harvest-hero.jpg" alt="" />
      <div class="scrim-top"></div>
    </div>
    <div class="brand">
      <img src="file:///Users/benknight/Code/The%20Harvest%20Website/client/public/images/logo-v1-dark-clean.png" alt="The Harvest" />
      <span class="place">Witta</span>
    </div>
    <div class="bar"></div>
    <div class="band">
      <div class="band-left">
        <div class="eyebrow">Opening Night</div>
        <div class="headline">Saturday 20 June</div>
        <div class="when">Pizza from 5pm, till dark</div>
        <div class="sub">Music, activities, and the old nursery open again. Come and say hello.</div>
        <div class="foot">
          <div class="price"><span class="amt">$30</span><span class="per">per person · pizza + activities</span></div>
          <div class="where">
            <svg width="25" height="25" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z" stroke="#E8C16A" stroke-width="2" fill="rgba(232,193,106,0.18)"/><circle cx="12" cy="10" r="2.6" stroke="#E8C16A" stroke-width="2"/></svg>
            <span>The Harvest · 9 Gumland Drive, Witta</span>
          </div>
        </div>
      </div>
      <div class="band-right">
        <div class="qr">
          <img src="file:///Users/benknight/Code/The%20Harvest%20Website/docs/strategy/weekend-20-june-2026/launch-flyer/qr-fb-event.png" alt="RSVP QR" />
          <div class="scan">Scan to say<br/>you're coming</div>
          <div class="fb">facebook → The Harvest Witta</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
